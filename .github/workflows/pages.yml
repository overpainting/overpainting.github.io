name: Deploy project website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Download Twyla
        run: curl -sSL https://github.com/samsartor/twyla/releases/download/latest/twyla-x86_64-unknown-linux-gnu.tar.gz | tar xz
      - name: Install figure fonts
        run: mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/
      - name: Build
        run: ./twyla build --root . --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
